<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pricing · Supra</title>
<meta name="description" content="Supra is free for up to 40 guests. The event pass for a whole wedding is 79 ₾, once. Pro for banquet halls and planners is 99 ₾ a month.">
<script>try{var th=localStorage.getItem("supra.theme");if(th)document.documentElement.dataset.theme=th}catch(e){}</script>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="stylesheet" href="/brand.css">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Serif+Display:wght@400;500;600&family=Noto+Serif+Georgian:wght@400;500;600;700&display=swap">
<style>
/* Pricing (plans from migration 011). Same tokens as index.html. */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:36px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{margin-right:auto;display:flex;align-items:center;padding-block:4px}
.hdrlogo{--bw:170px}@media (max-width:600px){.hdrlogo{--bw:130px}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 10px;font-size:13px}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--panel)}
.seg .short{display:none}@media (max-width:420px){.seg .full{display:none}.seg .short{display:inline}}
.iconb{width:34px;height:34px;border:1px solid var(--line);background:var(--panel);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;padding:0}.iconb svg{width:18px;height:18px}
.btn{font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:var(--r-control);padding:10px 16px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;color:var(--ink)}
h1{font-size:clamp(32px,5vw,52px);line-height:1.1;text-wrap:balance}
.lead{max-width:56ch;color:var(--muted);font-size:17px;margin:12px 0 0}
.plans{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));align-items:stretch}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:12px;position:relative}
.plan.best{border-color:var(--accent);box-shadow:0 24px 50px -34px rgba(120,50,70,.45)}
.badge{position:absolute;top:-11px;left:22px;background:var(--accent);color:var(--accent-ink);font-size:12px;border-radius:99px;padding:2px 10px}
.plan h2{font-size:24px}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price b{font-size:36px;font-weight:600;line-height:1}
.price span,.sub{color:var(--muted);font-size:14px}
.sub{margin:0}
.ticks{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:9px}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:2px;top:.5em;width:11px;height:11px;border-radius:50% 0 50% 50%;background:var(--accent);opacity:.8;transform:rotate(-45deg)}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.faq{display:grid;gap:10px;max-width:760px}
.faq h2{font-size:28px;margin-bottom:6px}
details{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
summary{cursor:pointer;font-weight:500}
details p{margin:8px 0 0;color:var(--muted)}
footer{border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:13px}
footer a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header><a class="logo" href="/" id="home"><span class="brand hdrlogo"><img class="brandimg brandimg-l" src="/brand/supra-logo.svg" width="170" height="59" alt="Supra"><img class="brandimg brandimg-d" src="/brand/supra-logo-dark.svg" width="170" height="59" alt="Supra"></span></a><div class="seg" id="lang" role="radiogroup"></div><button type="button" class="iconb" id="theme"></button></header>
  <main class="wrap" style="gap:40px;width:100%">
    <section aria-labelledby="h"><h1 id="h" data-t="ppH"></h1><p class="lead" data-t="ppLead"></p></section>
    <section class="plans" aria-labelledby="h">
      <article class="plan" aria-labelledby="p-free"><h2 id="p-free" data-t="ppFree"></h2><div class="price"><b data-t="ppFreePrice"></b></div><p class="sub" data-t="ppFreeSub"></p>
        <ul class="ticks"><li data-t="ppFree1"></li><li data-t="ppFree2"></li><li data-t="ppFree3"></li></ul></article>
      <article class="plan best" aria-labelledby="p-pass"><span class="badge" data-t="ppBest"></span><h2 id="p-pass" data-t="ppPass"></h2><div class="price"><b data-t="ppPassPrice"></b><span data-t="ppPassPer"></span></div><p class="sub" data-t="ppPassSub"></p>
        <ul class="ticks"><li data-t="ppPass1"></li><li data-t="ppPass2"></li><li data-t="ppPass3"></li></ul></article>
      <article class="plan" aria-labelledby="p-pro"><h2 id="p-pro" data-t="ppPro"></h2><div class="price"><b data-t="ppProPrice"></b><span data-t="ppProPer"></span></div><p class="sub" data-t="ppProSub"></p>
        <ul class="ticks"><li data-t="ppPro1"></li><li data-t="ppPro2"></li><li data-t="ppPro3"></li></ul></article>
    </section>
    <div class="cta"><a class="btn primary" href="/" data-t="ppStart"></a></div>
    <section class="faq" aria-labelledby="faqh"><h2 id="faqh" data-t="ppFaqH"></h2>
      <details><summary data-t="ppQ1"></summary><p data-t="ppA1"></p></details>
      <details><summary data-t="ppQ2"></summary><p data-t="ppA2"></p></details>
      <details><summary data-t="ppQ3"></summary><p><span data-t="ppA3"></span><span id="mail"></span></p></details>
      <details><summary data-t="ppQ4"></summary><p data-t="ppA4"></p></details>
    </section>
  </main>
  <footer><a href="/" data-t="ppBack"></a> · <a href="/privacy" data-t="lpPrivacy"></a></footer>
</div>
<script src="/config.js"></script>
<script src="/i18n.js"></script>
<script>
(() => {
  'use strict';
  const L = window.SUPRA_I18N, $ = s => document.querySelector(s);
  let lang = (() => { try { return localStorage.getItem('supra.lang'); } catch (e) { return null; } })() ||
    ((navigator.language || '').startsWith('ka') ? 'ka' : 'en');
  const t = k => (L[lang] || L.en)[k] ?? L.en[k] ?? k;
  const SUN = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    MOON = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  const theme = () => document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  function render() {
    document.documentElement.lang = lang;
    document.title = t('ppTitle');
    document.querySelector('meta[name=description]').content = t('ppMeta');
    document.querySelectorAll('[data-t]').forEach(el => (el.textContent = t(el.dataset.t)));
    $('#home').setAttribute('aria-label', t('ppBack'));
    const mail = (window.SUPRA_CONFIG || {}).supportEmail;
    $('#mail').innerHTML = '';
    if (mail) { const a = document.createElement('a'); a.href = 'mailto:' + mail; a.textContent = mail; $('#mail').append(' ', a); }
    const dark = theme() === 'dark', th = $('#theme');
    th.innerHTML = dark ? SUN : MOON;
    th.setAttribute('aria-label', t(dark ? 'toLight' : 'toDark'));
    th.title = t(dark ? 'toLight' : 'toDark');
    $('#lang').setAttribute('aria-label', t('language'));
    $('#lang').innerHTML = [['en', 'EN', 'English'], ['ka', 'ქარ', 'ქართული']].map(([k, s, full]) =>
      `<button type="button" role="radio" data-lang="${k}" aria-checked="${lang === k}" tabindex="${lang === k ? 0 : -1}" aria-label="${full}" lang="${k}"><span class="full">${full}</span><span class="short" aria-hidden="true">${s}</span></button>`).join('');
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.lang && b.dataset.lang !== lang) {
      lang = b.dataset.lang;
      try { localStorage.setItem('supra.lang', lang); } catch (x) {}
      render();
      $(`[data-lang="${lang}"]`).focus();
    }
    if (b.id === 'theme') {
      const n = theme() === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = n;
      try { localStorage.setItem('supra.theme', n); } catch (x) {}
      render();
      $('#theme').focus();
    }
  });
  document.addEventListener('keydown', e => {
    const items = [...document.querySelectorAll('#lang [role=radio]')], i = items.indexOf(e.target);
    if (i < 0) return;
    const j = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? (i + 1) % 2 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? (i + 1) % 2 : -1;
    if (j < 0) return;
    e.preventDefault();
    items[j].click();
  });
  render();
})();
</script>
</body>
</html>
