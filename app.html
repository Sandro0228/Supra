<title>Supra · Seating planner</title>
<script>try{var th=localStorage.getItem("supra.theme");if(th)document.documentElement.dataset.theme=th}catch(e){}</script>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="stylesheet" href="/brand.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans+Georgian:wght@400;500;700&family=Noto+Serif+Georgian:wght@500;700&display=swap">
<style>
/* Layout: canvas-first. A slim top bar with the three panels (Event, Guests, Share); the paper plan fills the rest;
   one slide-in panel shows whichever panel or selected item is active; floating toolbars sit on the canvas. */
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;margin:0}
body.guestmode{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
#app{height:100dvh;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);min-height:56px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:4px 10px 4px 4px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:13px;line-height:1.2;flex:none;border-right:1px solid var(--line);border-radius:10px 0 0 10px;margin-right:2px}
.back .chev{width:18px;height:18px;flex:none}
.edlogo{--bw:96px}.edemb{--bw:26px;display:none}
.backtxt{color:var(--muted);white-space:nowrap}
@media (max-width:1099px){.edlogo{display:none}.edemb{display:inline-flex}}
@media (max-width:599px){.edemb{display:none}.back{border-right:0;padding-right:6px}}
.back:hover{background:var(--soft)}
.title{display:flex;flex-direction:column;min-width:0;line-height:1.2}
#evname{margin:0;font-weight:400;font-family:var(--display);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
#stats{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.nav{display:flex;gap:2px;background:var(--soft);border-radius:10px;padding:3px}
.nav button{border:0;background:none;border-radius:8px;padding:7px 14px;font-size:14px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.nav button[aria-selected="true"]{background:var(--panel);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.tools{display:flex;align-items:center;gap:6px}
#savestate{font-size:12px;color:var(--muted);white-space:nowrap}
#savestate[data-state="dirty"]{color:var(--accent)}
.icon{width:34px;height:34px;border:1px solid var(--line);background:var(--panel);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;padding:0;color:var(--ink)}
.icon:hover{border-color:var(--muted)}
.icon svg{width:18px;height:18px}
.work{position:relative;flex:1;min-height:0;display:flex;background:var(--soft)}
.canvas{position:relative;flex:1;min-width:0;display:flex}
.navwrap{margin-inline:auto}
.scroller{flex:1;overflow:auto;min-width:0;cursor:grab;touch-action:pan-x pan-y;display:flex;overscroll-behavior:contain;padding:64px 8px 72px}
.scroller:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.scroller.panning{cursor:grabbing}
#plan{display:block;margin:auto;flex:none}
#plan .seat{cursor:pointer;touch-action:none}
#plan .tbody,#plan .venue{cursor:move;touch-action:none}
body.dragging,body.dragging *{cursor:grabbing!important}
#plan .seat:hover .ring{opacity:.45}
.float{position:absolute;display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:0 4px 18px rgba(20,25,22,.12);z-index:5}
.float .btn{border-color:transparent;padding:6px 10px;font-size:13px}
.float .btn:hover{background:var(--soft)}
.float .icon{border-color:transparent}
.float .icon:hover{background:var(--soft)}
.f-add{top:12px;left:12px}
.f-zoom{bottom:calc(12px + env(safe-area-inset-bottom,0px));right:max(12px,env(safe-area-inset-right,0px))}
.f-zoom .icon{width:40px;height:40px}
.f-zoom output{min-width:44px;display:inline-block;text-align:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
#hint{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:12px;z-index:5;background:var(--ink);color:var(--panel);border-radius:999px;padding:7px 8px 7px 14px;font-size:13px;display:flex;align-items:center;gap:8px;max-width:calc(100% - 370px)}
#hint button{border:0;background:none;color:inherit;opacity:.8;font-size:18px;line-height:1;min-width:32px;min-height:32px;border-radius:50%}
.drawer{position:relative;width:360px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:14px}
.drawer .dhead{display:flex;align-items:center;gap:8px;justify-content:space-between}
.drawer h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;text-wrap:balance}
.drawer h3{font-size:14px;margin:6px 0 0}
#left,#right{display:flex;flex-direction:column;gap:14px}
details.more{border-top:1px solid var(--line);padding-top:12px}
details.more>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-weight:500;padding:2px 0}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-right:4px;transition:transform .15s}
details.more[open]>summary::after{transform:rotate(-135deg)}
details.more>.body{display:flex;flex-direction:column;gap:8px;padding-top:10px}
body.focus .bar{display:none}
.work:fullscreen{background:var(--soft)}
@media (max-width:900px){
  .bar{gap:8px}
  .navwrap{order:5;width:100%}.nav{width:100%;justify-content:space-between}.nav button{flex:1;justify-content:center;min-height:40px}
  #evname{max-width:48vw}
  /* Panels become a modal sheet: whole sheet on screen, heading first, the plan underneath is inert. */
  .backdrop{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:18}
  .drawer{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px));border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);z-index:19;
    padding:12px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overscroll-behavior:contain}
  .drawer::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 2px;flex:none}
  .drawer .dhead{position:sticky;top:-12px;background:var(--panel);padding-block:6px;z-index:1}
  .drawer .dhead .icon{width:44px;height:44px}
  .f-add{left:8px;top:8px;right:8px;overflow-x:auto}
  .f-add .btn{min-height:40px}
  .f-zoom{right:max(8px,env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .f-zoom .icon{width:44px;height:44px}
  .f-zoom output{display:none}
  #hint{left:8px;right:8px;max-width:none;bottom:calc(68px + env(safe-area-inset-bottom,0px));border-radius:14px}
  .row2{grid-template-columns:1fr}
}
@media (max-width:520px){#savestate{display:none}.seg button{padding:6px 8px}}
/* Layout: three-pane workbench — tabbed event/guest/share panel left, the paper floor plan centre, the inspector right; a separate full-screen "find my seat" view for guests */
:root{
  --bg:#EEF0EA; --panel:#FFFFFF; --ink:#24302A; --muted:#66706A; --line:#DADFD5;
  --accent:#B4506F; --accent-ink:#FFFFFF; --soft:#F5F6F1; --danger:#B3261E; --warn-bg:#FBEDE9;
  --display:"Marcellus","Noto Serif Georgian",Georgia,serif;
  --body:"Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141917; --panel:#1D2421; --ink:#E7EBE4; --muted:#9BA59E; --line:#2F3934;
  --accent:#E08AA6; --accent-ink:#2A1018; --soft:#232B27; --danger:#F2867E; --warn-bg:#3A2420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --panel:#1D2421; --ink:#E7EBE4; --muted:#9BA59E; --line:#2F3934;
  --accent:#E08AA6; --accent-ink:#2A1018; --soft:#232B27; --danger:#F2867E; --warn-bg:#3A2420; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#plan :focus{outline:none}
#plan .seat:focus-visible .ring{opacity:.5!important;stroke:var(--ink);stroke-width:4}
#plan .tbody:focus-visible,#plan .venue:focus-visible{outline:3px solid var(--accent);outline-offset:6px}
.apploading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);background:var(--bg)}
.spinner{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
:lang(ka) .lbl,:lang(ka) .gdate{text-transform:none;letter-spacing:.02em;font-size:12px}
:lang(ka) body{line-height:1.55}
p{margin:0}
.muted{color:var(--muted);font-size:13px}.small{font-size:12px}
#stats{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sides{display:inline-flex;gap:5px;align-items:center}.sides i,.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px}
.warn{border:1px solid var(--danger);color:var(--danger);background:var(--warn-bg);border-radius:999px;padding:2px 10px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 10px;font-size:13px}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--panel)}
#savestate{font-size:12px;color:var(--muted)}
#savestate[data-state="dirty"]{color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.pane h2{font-family:var(--display);font-weight:400;font-size:17px;margin:0;text-wrap:balance}
.pane h3{font-size:14px;margin:6px 0 0}
.sec{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input:not([type=checkbox]):not([type=radio]),.field select,.field textarea,.inp,.sec select{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.between{justify-content:space-between}.row.end{justify-content:flex-end}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.static{padding:7px 0;font-weight:500}
.check{display:flex;align-items:center;gap:6px;padding:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:4px 10px;font-size:13px;display:inline-flex;align-items:center}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);padding:0}
.sw[aria-pressed="true"],.sw[aria-checked="true"]{box-shadow:0 0 0 2px var(--accent)}
.tlist{display:flex;flex-direction:column;gap:2px}
.titem{display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:6px 8px}
.titem:hover{background:var(--soft)}
.titem[aria-current="true"]{border-color:var(--accent);background:var(--soft)}
.titem span:last-child{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.waiting{display:flex;flex-wrap:wrap;gap:6px}
.wchip{border:1px dashed var(--muted);background:none;border-radius:999px;padding:3px 10px;font-size:13px}
.wchip[aria-pressed="true"]{border-style:solid;border-color:var(--accent);color:var(--accent)}
.rules{display:flex;flex-direction:column;gap:4px}
.rule{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;font-size:13px;padding:5px 8px;border-radius:8px;background:var(--soft)}
.rule.bad{background:var(--warn-bg)}
.pill{font-size:11px;border-radius:999px;padding:1px 8px;background:var(--panel);border:1px solid var(--line)}
.pill.bad{color:var(--danger);border-color:var(--danger)}
.x{border:0;background:none;font-size:16px;line-height:1;color:var(--muted);padding:2px 4px}
.confirm{border:1px solid var(--accent);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.confirm.danger{border-color:var(--danger)}
#plan{display:block;margin:0 auto}
#plan .seat{cursor:pointer;touch-action:none}
#plan .tbody,#plan .venue{cursor:grab;touch-action:none}
body.dragging,body.dragging *{cursor:grabbing!important}
#plan .seat:hover .ring{opacity:.45}
.who{display:flex;gap:12px;align-items:center}
.preview{background:var(--soft);border-radius:10px;padding:4px;flex:none}
.whotxt{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.whotxt h2{word-break:break-word}
.how{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.search-res{display:flex;flex-direction:column;gap:2px;max-height:200px;overflow:auto}
.search-res button{text-align:left;border:0;background:none;padding:5px 6px;border-radius:6px;display:flex;justify-content:space-between;gap:8px}
.search-res button:hover{background:var(--soft)}
.search-res small{color:var(--muted)}
.qr{display:flex;justify-content:center}.qr:empty{display:none}
.qr img,.qr canvas{border:8px solid #FFFFFF;border-radius:8px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper output{min-width:34px;text-align:center;font-variant-numeric:tabular-nums;font-weight:500}
.modal{position:fixed;inset:0;background:rgba(10,14,12,.55);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .box{background:var(--panel);border-radius:12px;padding:18px;max-width:900px;width:100%;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal h2{font-family:var(--display);font-weight:400;margin:0;font-size:20px}
.modal img{width:100%;border-radius:8px;border:1px solid var(--line);background:#FFFFFF}
.cardpages{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cardpages figure{margin:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.tablewrap{overflow-x:auto}
table.cat{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
.cat th,.cat td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right;white-space:nowrap}
.cat th:first-child,.cat td:first-child{text-align:left}
.cat th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
.cat .tot td{font-weight:700;border-top:2px solid var(--ink)}
.al{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:8px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}
#guest{min-height:100%}
.gwrap{max-width:560px;margin:0 auto;padding-block:28px;display:flex;flex-direction:column;gap:14px;text-align:center}
.glang{display:flex;justify-content:flex-end;gap:4px}
.glang button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px;font-size:13px}
.glang button[aria-checked="true"]{background:var(--ink);color:var(--panel)}
.glang button{min-height:36px;min-width:44px}
.gdate{color:var(--accent);letter-spacing:.12em;text-transform:uppercase;font-size:12px}
.gwrap h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,8vw,48px);margin:0;line-height:1.1;text-wrap:balance}
.gwrap h2{font-family:var(--display);font-weight:400;font-size:20px;margin:6px 0 0;color:var(--muted)}
.ginput{font-size:20px;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);width:100%}
.ginput:focus{border-color:var(--accent)}
.ginput:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.gform{display:flex;flex-direction:column;gap:10px;text-align:left}
.gform h2{text-align:center}
.gfield{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
.gfield small,.ghint{color:var(--muted);font-weight:400;font-size:13px}
.gfind{min-height:48px;font-size:16px}
.gres{min-height:56px}
.ghits{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ghit{width:100%;min-height:48px;align-items:center}
.gseat{color:var(--muted);font-weight:400}
.gcard h3.lbl{margin:8px 0 0}
.gcard:focus{outline:none}.gcard:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.gwait{opacity:.8}
.sharelink{margin:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:14px;overflow-wrap:anywhere;word-break:break-all}
.sharelink .host{color:var(--muted)}.sharelink .code{font-size:16px;letter-spacing:.04em}
.qr{display:flex;justify-content:center}.qr img,.qr canvas{max-width:min(180px,100%);height:auto!important}
.pubbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.pubbox h3{margin:0;font-size:15px}
.publist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.pubbox fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.gres{display:flex;flex-direction:column;gap:8px}
.ghit{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);text-align:left}
.ghit .gtable{color:var(--accent);white-space:nowrap}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px}
.gbig{font-family:var(--display);font-size:40px;color:var(--accent);line-height:1.1}
.gcard .gname{font-size:18px;font-weight:500}
.gwith{color:var(--muted);font-size:14px}
.gnone{color:var(--muted)}
.gmap{display:flex;flex-direction:column;gap:8px}.gmap svg{width:100%;height:auto;max-height:70vh;border-radius:12px;border:1px solid var(--line)}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:13px;align-self:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.linkrow{grid-template-columns:1fr auto}
[hidden]{display:none!important}
a.btn{text-decoration:none;color:inherit}
.filepick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative}
.fileinput{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.fileinput:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}
.filepick label.btn{cursor:pointer}
.fname{color:var(--muted);overflow-wrap:anywhere;min-width:0}
.drawer .btn,.modal .btn{white-space:normal;text-align:left;max-width:100%}
@media (max-width:900px){.row2{grid-template-columns:1fr}}
.chip{white-space:normal;text-align:left}
.nav button{min-width:0}.nav button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:400px){.nav button svg{display:none}.nav button{padding:7px 6px}}
.gpowered{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.gplogo{--bw:100px}
</style>
</head>
<body>

<div id="app">
<header class="bar">
  <a class="back" id="backlink" href="/" aria-label="Supra — My events"><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg><span class="brand edlogo"><img class="brandimg brandimg-l" src="/brand/supra-logo.svg" width="96" height="34" alt=""><img class="brandimg brandimg-d" src="/brand/supra-logo-dark.svg" width="96" height="34" alt=""></span><span class="brand edemb"><img class="brandimg brandimg-l" src="/brand/supra-emblem.svg" width="26" height="26" alt=""><img class="brandimg brandimg-d" src="/brand/supra-emblem-dark.svg" width="26" height="26" alt=""></span><span class="backtxt" id="backtxt">My events</span></a>
  <div class="title"><h1 id="evname">Supra</h1><span id="stats"></span></div>
  <nav class="navwrap" aria-label="Planner"><div class="nav" id="nav" role="tablist" aria-label="Panels"></div></nav>
  <div class="tools">
    <span id="savestate" role="status"></span><button type="button" class="btn primary sm" id="save" hidden>Save</button>
    <button type="button" class="icon" id="undo" aria-label="Undo" title="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <div class="seg" id="lang" role="radiogroup" aria-label="Language"></div>
    <button type="button" class="icon" id="theme" aria-label="Dark mode" aria-pressed="false"></button>
  </div>
</header>
<main class="work" id="work">
  <div class="canvas" id="canvas">
    <div class="float f-add" id="quickadd" role="toolbar" aria-label="Add to the room"></div>
    <div class="scroller" id="scroller" tabindex="0" role="region" aria-label="Seating plan" aria-describedby="plankeys"><svg id="plan" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"></svg></div>
    <p id="plankeys" class="sr"></p>
    <div id="hint" role="note" hidden></div>
    <div class="float f-zoom" id="zoombar" role="toolbar" aria-label="Zoom">
      <button type="button" class="icon" id="zout" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <output id="zpct" aria-live="polite">100%</output>
      <button type="button" class="icon" id="zin" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button type="button" class="icon" id="zall" aria-label="Fit all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 9h8v6H8z"/></svg></button>
      <button type="button" class="icon" id="zwidth" aria-label="Fit width"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg></button>
      <button type="button" class="icon" id="help" aria-label="How to move around" aria-expanded="false" aria-controls="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17.5v.01"/></svg></button>
      <button type="button" class="icon" id="full" aria-label="Full screen" title="Full screen"></button>
    </div>
  </div>
  <div class="backdrop" id="backdrop" hidden></div>
  <div class="drawer" id="drawer" hidden><div id="left"></div><div id="right"></div></div>
  <div id="modalroot"></div>
</main>
</div>
<main id="guest" hidden></main>
<main id="loading" class="apploading" role="status"><span class="spinner" aria-hidden="true"></span><span id="loadingtxt">Loading your plan…</span></main>
<svg id="gsvg" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true" focusable="false"><defs id="gdefs"></defs></svg>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/assets.js"></script>
<script src="/i18n.js"></script>
<script src="/brand.js"></script>
<script src="/app.js"></script>
</body>
</html>
