<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Supra · Wedding seating planner</title>
<meta name="description" content="Plan who sits where at your wedding, with every guest drawn at their seat. Free floor plan, place cards and a find-my-seat page for guests.">
<script>try{var th=localStorage.getItem("supra.theme");if(th)document.documentElement.dataset.theme=th}catch(e){}</script>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="stylesheet" href="/brand.css">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Serif+Display:wght@400;500;600&family=Noto+Serif+Georgian:wght@400;500;600;700&display=swap">
<style>
/* Layout: signed out, a landing page that shows the product itself: the hall from above, the guest's phone and the
   place cards, made from a demo wedding in the real app (landing/*.webp, English and Georgian), then the sign-in card.
   Signed in, only the event list. Text left-aligned; one bold thing (the hall), everything around it quiet. */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--panel)}
.tabbtn[aria-selected="true"]{background:var(--panel);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.loading{flex-direction:row;align-items:center;justify-content:center;gap:12px;color:var(--muted);min-height:180px}
.spinner{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;display:inline-block}
.spinner.sm{width:14px;height:14px;border-width:2px;border-top-color:currentColor;border-color:color-mix(in srgb,currentColor 30%,transparent);border-top-color:currentColor}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.4s}}
ul.events{list-style:none;margin:0;padding:0}
.soon{margin:0}
.btn[aria-busy="true"]{opacity:.8}

.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{flex:0 0 auto;margin-right:auto;display:flex;align-items:center;padding-block:4px;padding-right:8px}
.hdrlogo{--bw:170px}
@media (max-width:600px){.hdrlogo{--bw:130px}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 10px;font-size:13px}

.who{font-size:13px;color:var(--muted)}
.iconb{width:34px;height:34px;border:1px solid var(--line);background:var(--panel);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;padding:0;color:var(--ink)}.iconb svg{width:18px;height:18px}
.btn{font-weight:500;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-control);padding:9px 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
/* ---- landing ---- */
.lp{display:flex;flex-direction:column;gap:clamp(56px,9vw,112px);margin-top:clamp(12px,3vw,32px)}
.lp h1,.lp h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;color:var(--ink)}
.lp h1{font-size:clamp(42px,7vw,80px);line-height:1.02;max-width:12ch;letter-spacing:-.015em;font-weight:500}
:lang(ka) .lp h1{font-size:clamp(34px,5vw,60px);line-height:1.12;max-width:15ch}
:lang(ka) .lp h2{font-size:clamp(25px,2.8vw,34px)}
@media (max-width:480px){header{gap:8px}.hdrlogo{--bw:108px}}
@media (max-width:400px){.hdrlogo{--bw:92px}.logo{padding-right:0}}
.lp h2{font-size:clamp(28px,3.4vw,40px);line-height:1.12;max-width:20ch}
.lp p{margin:0}
.lead{font-size:clamp(17px,1.6vw,19px);line-height:1.6;color:var(--muted);max-width:56ch}
.hero2{display:grid;gap:clamp(32px,5vw,56px)}
.herotext{display:grid;gap:22px;justify-items:start}
.herotext .lead{max-width:48ch}
.ctas{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center}
.btn.big{padding:14px 24px;font-size:16px}
.textlink{color:var(--ink);font-weight:500;text-decoration:underline;text-decoration-color:var(--line);text-decoration-thickness:2px;text-underline-offset:5px;padding:6px 0}
.textlink:hover{text-decoration-color:var(--ink)}
.note{font-size:14px;color:var(--muted)}
.hdrnav{display:flex;gap:22px;font-size:14px;margin-right:8px}
.hdrnav a{color:var(--muted);text-decoration:none}.hdrnav a:hover{color:var(--ink)}
@media (max-width:720px){.hdrnav{display:none}}
/* the hall: the one bold thing on the page */
.hallframe{margin:0;border-radius:var(--r-panel);overflow:hidden;background:#EADBC6;
  outline:1px solid color-mix(in srgb,var(--gold) 45%,transparent);outline-offset:6px;
  box-shadow:0 30px 60px -36px rgba(36,23,31,.45)}
.hallframe img{display:block;width:100%;height:auto}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:28px;counter-reset:step}
@media (min-width:760px){.steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
.steps li{display:grid;gap:8px;align-content:start;counter-increment:step;padding-top:18px;border-top:1px solid var(--line)}
.steps li::before{content:counter(step);font-family:var(--display);font-size:32px;line-height:1;color:var(--gold)}
.steps h3{font-size:18px;font-weight:500;margin:0}
.steps p{color:var(--muted)}
.howhead{display:grid;gap:28px}
.split{display:grid;gap:clamp(28px,5vw,64px);align-items:center}
@media (min-width:860px){.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.split.flip>:first-child{order:2}}
.splittext{display:grid;gap:18px;justify-items:start}
.ticks{list-style:none;margin:0;padding:0;display:grid;gap:12px;max-width:52ch}
.ticks li{position:relative;padding-left:28px}
.ticks li::before{content:"";position:absolute;left:3px;top:.62em;width:9px;height:9px;border-radius:50% 0 50% 50%;background:var(--gold);transform:rotate(-45deg)}
.phone{justify-self:center;width:min(300px,78vw);border-radius:38px;border:10px solid #24171F;background:#24171F;overflow:hidden;
  box-shadow:0 30px 60px -28px rgba(36,23,31,.45);margin:0}
.phone img{display:block;width:100%;height:auto;border-radius:28px}
.cardsimg{margin:0;border-radius:var(--r-panel);overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:0 24px 50px -30px rgba(36,23,31,.35)}
.cardsimg img{display:block;width:100%;height:auto}
.start{display:grid;gap:24px;align-items:start;scroll-margin-top:24px}
@media (min-width:860px){.start{grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:48px;align-items:center}}
.start .signin{margin:0}
.signedin .start{display:block}
/* ---- signed in: your events ---- */
.dash{display:flex;flex-direction:column;gap:28px}.yours{display:flex;flex-direction:column;gap:12px}
.dashhead{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.dashhead h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,4vw,44px);line-height:1.1;margin:0}
.newp{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,28px);display:grid;gap:16px}
.newp.first{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));box-shadow:0 20px 40px -30px rgba(120,50,70,.35)}
.newhead{display:grid;gap:4px}.newhead h2{font-size:24px}
.newgrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr) auto;gap:12px;align-items:start}
.newfoot{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.newfoot .btn{margin-left:auto}
.newfoot label.linkish{cursor:pointer;color:var(--ink)}
.events{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:18px}
.ev{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:grid;grid-template-columns:minmax(110px,150px) minmax(0,1fr);min-width:0;
  transition:box-shadow .2s,border-color .2s}
.ev:hover{border-color:color-mix(in srgb,var(--c) 30%,var(--line));box-shadow:0 18px 40px -28px rgba(60,35,30,.35)}
.events.one{grid-template-columns:1fr}
.events.one .ev{grid-template-columns:minmax(200px,340px) minmax(0,1fr)}
.cover{position:relative;display:grid;place-items:center;min-height:190px;overflow:hidden;text-decoration:none;
  background:radial-gradient(120% 90% at 50% 40%,color-mix(in srgb,var(--c) 10%,var(--panel)),color-mix(in srgb,var(--c) 22%,var(--panel)))}
.mono{position:relative;font-family:var(--display);font-size:clamp(28px,3.4vw,40px);color:var(--c);letter-spacing:.02em;white-space:nowrap}
.events.one .mono{font-size:clamp(34px,4.4vw,52px)}
.fl{position:absolute;width:62%;max-width:170px;right:-14%;bottom:-16%;opacity:.95;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(70,40,30,.12))}
.evbody{padding:clamp(16px,2.4vw,24px);display:flex;flex-direction:column;gap:12px;min-width:0}
.evtop{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.evname{font-family:var(--display);font-weight:400;font-size:clamp(22px,2.4vw,28px);line-height:1.15;margin:0;overflow-wrap:break-word}
.events.one .evname{font-size:clamp(26px,3vw,36px)}
.evname a{color:inherit;text-decoration:none}.evname a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.pill{flex:none;font-size:12px;border-radius:999px;padding:3px 10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px;opacity:.6}
.pill.on{color:var(--sage);border-color:color-mix(in srgb,var(--sage) 40%,var(--line))}.pill.on::before{background:var(--sage);opacity:1}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill.plan::before{display:none}.pill.plan.paid{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.pill.plan.over{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.when{margin:0;display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:14px}
.when .count{color:var(--ink);font-weight:500}.when .count.soon{color:var(--accent)}
.prog{display:grid;gap:6px}
.facts{margin:0;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--muted)}
.facts .seated{color:var(--ink);font-weight:500}
/* status and plan sit in the text, not in outlined pills */
.ev .pill{border:0;padding:0;border-radius:0;font-size:13px}
.ev .pill.status{align-self:flex-start;padding-right:48px}
.ev .facts .pill{font-size:14px;color:var(--muted)}
.ev .facts .pill.plan.paid{color:var(--accent)}.ev .facts .pill.plan.over{color:var(--danger)}
.bar{height:6px;border-radius:99px;background:color-mix(in srgb,var(--c) 12%,var(--soft));overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--c)}
.evact{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:auto;padding-top:6px}
.evbody{position:relative}
.evmore{position:absolute;top:clamp(10px,1.8vw,16px);right:clamp(10px,1.8vw,16px)}
.btn.more{width:40px;height:40px;padding:0;color:var(--muted)}
.btn.more[aria-expanded="true"]{color:var(--ink);border-color:var(--muted)}
.evmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:5;min-width:220px;display:grid;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-panel);box-shadow:0 18px 40px -18px rgba(36,23,31,.35)}
.evmenu [role=menuitem]{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;border-radius:var(--r-control);background:none;color:var(--ink);font:inherit;font-size:14px;text-align:left;text-decoration:none;cursor:pointer}
.evmenu [role=menuitem]:hover,.evmenu [role=menuitem]:focus-visible{background:var(--soft);outline:none}
.evmenu .danger{color:var(--danger)}
.evact .linkish{margin-left:auto}
.evact .linkish.danger{color:var(--muted)}.evact .linkish.danger:hover,.evact .linkish.danger:focus-visible{color:var(--danger)}
@media (max-width:560px){.ev,.events.one .ev{grid-template-columns:1fr}.cover{min-height:120px}.newgrid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.ev{transition:none}}
/* dark: lift each wedding's colour so initials and progress stay readable on dark covers */
.ev{--c:var(--pal)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ev{--c:var(--pal-d)}}
:root[data-theme="dark"] .ev{--c:var(--pal-d)}
.confirm .row{display:flex;gap:8px;flex-wrap:wrap}.confirm p{margin:0}
/* trash: deleted events, 30 days to restore */
.trash{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.lp .trashh{font:inherit;font-family:var(--body);margin:0}.trashtog{font-family:var(--body)}
.fvword{text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink);font-size:13px}
.trashtog{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:4px 0;color:var(--muted);font-size:14px}
.trashtog:hover{color:var(--ink)}
.trashtog::after{content:"";width:7px;height:7px;border:solid currentColor;border-width:0 1.5px 1.5px 0;transform:rotate(45deg);margin:-3px 0 0 2px}
.trashtog[aria-expanded="true"]::after{transform:rotate(-135deg);margin-top:3px}
.tcount{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:0 7px;line-height:18px}
.tlist{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px}
.titem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tmain{display:grid;gap:2px;min-width:0}.tname{overflow-wrap:anywhere}
.tact{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tact .linkish.danger:hover,.tact .linkish.danger:focus-visible{color:var(--danger)}
.titem .confirm{grid-column:1/-1}
@media (max-width:560px){.titem{grid-template-columns:1fr}}
/* account */
.account .acsec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-panel);padding:clamp(16px,3vw,24px);display:grid;gap:12px;max-width:720px}
.account .acsec.danger{border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
.account .acsec h2{font-size:24px;font-weight:500}.account h3{font-size:15px;font-weight:600;margin:0}
.account .acsec p{margin:0}
.acform{display:grid;gap:10px;max-width:420px}
.account .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.account a{color:var(--accent)}.account a.btn{color:var(--ink)}
.aclist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
/* home: greeting, the next wedding and its next step; the feast painting above once it exists */
.home{display:grid;gap:clamp(20px,3vw,32px)}
.feast{margin:0;border-radius:var(--r-panel);overflow:hidden;outline:1px solid color-mix(in srgb,var(--gold) 45%,transparent);outline-offset:6px;box-shadow:0 30px 60px -40px rgba(36,23,31,.5);background:#17130f}
.feast[hidden]{display:none}
.feast img{display:block;width:100%;height:auto;aspect-ratio:3/1;object-fit:cover;object-position:center}
@media (max-width:600px){.feast img{aspect-ratio:16/9}}
.homerow{display:grid;gap:20px 40px;align-items:end}
@media (min-width:860px){.homerow{grid-template-columns:minmax(0,1fr) minmax(0,380px)}}
.hometext{display:grid;gap:6px}
.hello{margin:0;color:var(--muted);font-size:16px}
.home h1{font-family:var(--display);font-weight:500;font-size:clamp(38px,6vw,64px);line-height:1.04;margin:0;text-wrap:balance}
.homewhen{margin:4px 0 0;display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:15px}.homewhen .count{color:var(--ink);font-weight:500}
.nextstep{display:grid;gap:14px;justify-items:start;padding:18px 20px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r-panel)}
.nextstep p{margin:0;font-size:15px}
.dash .dashhead h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,3vw,34px);margin:0}
/* account menu (signed in): initials button with account, plans, theme and sign out */
.acct{position:relative}
.acctbtn{width:38px;height:38px;border-radius:50%;border:1px solid color-mix(in srgb,var(--gold) 55%,var(--line));background:color-mix(in srgb,var(--accent) 10%,var(--panel));color:var(--accent);font-family:var(--display);font-size:17px;font-weight:500;display:grid;place-items:center;padding:0;cursor:pointer}
.acctbtn:hover,.acctbtn[aria-expanded="true"]{background:color-mix(in srgb,var(--accent) 16%,var(--panel))}
.acctmenu{position:absolute;right:0;top:calc(100% + 8px);z-index:20;min-width:250px;display:grid;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-panel);box-shadow:0 20px 44px -18px rgba(36,23,31,.4)}
.acctmenu[hidden]{display:none}
.acctwho{display:flex;align-items:center;gap:10px;padding:10px 12px 12px;margin-bottom:4px;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted);min-width:0}
.acctwho #who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acctinit{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 10%,var(--panel));color:var(--accent);font-family:var(--display);font-size:14px}
.acctmenu [role=menuitem]{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;border-radius:var(--r-control);background:none;color:var(--ink);font:inherit;font-size:14px;text-align:left;text-decoration:none;cursor:pointer}
.acctmenu [role=menuitem]:hover,.acctmenu [role=menuitem]:focus-visible{background:var(--soft);outline:none}
.acctmenu #signout{border-top:1px solid var(--line);border-radius:0 0 var(--r-control) var(--r-control);margin-top:4px;padding-top:12px}
footer.foot{border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:13px}footer.foot a{color:inherit}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
.signin{max-width:420px;width:100%;margin:0 auto}
.field{display:flex;flex-direction:column;gap:5px}
.lbl{font-size:13px;font-weight:500;color:var(--ink);letter-spacing:0}
.inp,select{border:1px solid var(--line);background:var(--soft);border-radius:var(--r-control);padding:10px 12px;width:100%;min-width:0}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.msg{font-size:14px;color:var(--muted)}.msg.err{color:var(--danger)}
h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.confirm{border:1px solid var(--danger);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:14px}
/* Same height for the name box, dropdown, date picker and button; the button sits level with the boxes, below the labels */
.newgrid .inp,.newgrid select,.newgrid>.btn{height:calc(1.55em + 22px)}
.newgrid .lbl{line-height:16px;min-height:16px}
.newgrid>.btn{margin-top:21px}
.empty{color:var(--muted);text-align:center;padding:24px;border:1px dashed var(--line);border-radius:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:9px;font-size:14px;z-index:30}
.small{font-size:13px;color:var(--muted)}
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--soft);border-radius:10px;padding:4px}
.tabbtn{border:0;background:none;border-radius:7px;padding:8px;color:var(--muted)}
.tabbtn[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.linkish{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:13px;padding:2px 0}
.row2l{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
h2+.field{margin-top:4px}
@media (max-width:720px){.newgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.newgrid .field:first-child{grid-column:1/-1}.newgrid>.btn{margin-top:0}}
.filepick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative}
.fileinput{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.fileinput:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}
.filepick label.btn{cursor:pointer}
.fname{color:var(--muted);overflow-wrap:anywhere;min-width:0}
.seg .short{display:none}
@media (max-width:420px){.seg .full{display:none}.seg .short{display:inline}}
@media (max-width:420px){.newgrid{grid-template-columns:minmax(0,1fr)}}
.newgrid .field{min-width:0}
</style>
