<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Supra · Wedding seating planner</title>
<meta name="description" content="Plan who sits where at your wedding, with every guest drawn at their seat. Free floor plan, place cards and a find-my-seat page for guests.">
<script>try{var th=localStorage.getItem("supra.theme");if(th)document.documentElement.dataset.theme=th}catch(e){}</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans+Georgian:wght@400;500;700&family=Noto+Serif+Georgian:wght@500;700&display=swap">
<style>
/* Layout: one calm column — a hero that shows the head-table illustration, then either the sign-in card or the event list */
:root{
  --bg:#F6F1EA; --panel:#FFFFFF; --ink:#2B2522; --muted:#6E655F; --line:#E4DACD;
  --accent:#B4506F; --accent-ink:#FFFFFF; --soft:#FBF8F3; --danger:#B3261E; --sage:#6F8F72;
  --display:"Marcellus","Noto Serif Georgian",Georgia,serif;
  --body:"Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A1716; --panel:#24201E; --ink:#F1EAE3; --muted:#B3A79D; --line:#3A332F;
  --accent:#E08AA6; --accent-ink:#2A1018; --soft:#2B2624; --danger:#F2867E; --sage:#97B79A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1716; --panel:#24201E; --ink:#F1EAE3; --muted:#B3A79D; --line:#3A332F;
  --accent:#E08AA6; --accent-ink:#2A1018; --soft:#2B2624; --danger:#F2867E; --sage:#97B79A; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--panel)}
.tabbtn[aria-selected="true"]{background:var(--panel);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.loading{flex-direction:row;align-items:center;justify-content:center;gap:12px;color:var(--muted);min-height:180px}
.spinner{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;display:inline-block}
.spinner.sm{width:14px;height:14px;border-width:2px;border-top-color:currentColor;border-color:color-mix(in srgb,currentColor 30%,transparent);border-top-color:currentColor}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.4s}}
.dash{display:flex;flex-direction:column;gap:22px}.yours{display:flex;flex-direction:column;gap:12px}
ul.events{list-style:none;margin:0;padding:0}
.soon{margin:0}
.btn[aria-busy="true"]{opacity:.8}

.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:26px;letter-spacing:.02em;flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 10px;font-size:13px}

.who{font-size:13px;color:var(--muted)}
.iconb{width:34px;height:34px;border:1px solid var(--line);background:var(--panel);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;padding:0;color:var(--ink)}.iconb svg{width:18px;height:18px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.hero{display:grid;gap:18px;text-align:center;justify-items:center}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,5.4vw,52px);line-height:1.1;margin:0;max-width:18ch;text-wrap:balance}
.hero img{width:100%;max-width:820px;height:auto}
.feats{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;color:var(--muted);font-size:14px;margin:0;padding:0;list-style:none}
.feats li::before{content:"✿ ";color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
.signin{max-width:420px;width:100%;margin:0 auto}
.field{display:flex;flex-direction:column;gap:5px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.inp,select{border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:10px 12px;width:100%;min-width:0}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.msg{font-size:14px;color:var(--muted)}.msg.err{color:var(--danger)}
h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.events{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ev{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ev h3{font-family:var(--display);font-weight:400;font-size:21px;margin:0;word-break:break-word}
.ev .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ev .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.confirm{border:1px solid var(--danger);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.newgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end}
.empty{color:var(--muted);text-align:center;padding:24px;border:1px dashed var(--line);border-radius:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:9px;font-size:14px;z-index:30}
.small{font-size:13px;color:var(--muted)}
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--soft);border-radius:10px;padding:4px}
.tabbtn{border:0;background:none;border-radius:7px;padding:8px;color:var(--muted)}
.tabbtn[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.linkish{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:13px;padding:2px 0}
.row2l{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
h2+.field{margin-top:4px}
@media (max-width:720px){.newgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.newgrid .field:first-child{grid-column:1/-1}}
.filepick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative}
.fileinput{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.fileinput:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}
.filepick label.btn{cursor:pointer}
.fname{color:var(--muted);overflow-wrap:anywhere;min-width:0}
.seg .short{display:none}
@media (max-width:420px){.seg .full{display:none}.seg .short{display:inline}}
@media (max-width:420px){.newgrid{grid-template-columns:minmax(0,1fr)}}
.newgrid .field{min-width:0}
:lang(ka) .lbl{text-transform:none;letter-spacing:.02em;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo">Supra</div><span class="who" id="who"></span><div class="seg" id="lang" role="radiogroup"></div><button type="button" class="iconb" id="theme" aria-label="Light / dark" title="Light / dark"></button><button type="button" class="btn sm" id="signout" hidden></button></header>
  <main>
  <section class="hero" aria-labelledby="tag">
    <h1 id="tag">Plan who sits where, with every guest drawn at their seat.</h1>
    <img src="/hero.webp" width="1400" height="583" alt="Five illustrated wedding guests sitting at a flower-decorated head table">
    <ul class="feats" id="feats"></ul>
  </section>
  <div id="main" aria-live="polite"></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/i18n.js"></script>
<script src="/dash.js"></script>
</body>
</html>
